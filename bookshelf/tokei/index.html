<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七分遅れの時計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 右綴じの上製本を机の上に開く。紙は象牙、布表紙は藍、朱は章番号だけ。 */
:root {
  --desk: #14171c;
  --ink: #1e1c19;
  --paper: #f0ece1;
  --faint: #8b8676;
  --navy: #1c2a3d;
  --gold: #c8ad6e;
  --accent: #9a2f2b;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --ease: cubic-bezier(.45, .05, .25, 1);
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, #232932 0%, var(--desk) 72%);
}
#stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  outline: none;
}
.book {
  position: relative;
  perspective: 2800px;
  transition: transform .95s var(--ease);
}
.shadow {
  position: absolute;
  left: 0; bottom: -22px;
  height: 36px;
  background: radial-gradient(ellipse at 50% 40%, rgba(0, 0, 0, .6), transparent 70%);
  filter: blur(7px);
  transition: width .95s var(--ease);
}

/* 本の骨格：裏表紙の板、小口の紙の厚み、めくれる丁 */
.board {
  position: absolute;
  top: -5px; left: -5px;
  width: calc(var(--W) + 5px);
  height: calc(var(--H) + 10px);
  background: var(--navy);
  border-radius: 4px 0 0 4px;
  z-index: 1;
}
.board .ep { position: absolute; inset: 5px 0 5px 5px; }
.edge {
  position: absolute;
  top: 1px;
  width: var(--W);
  height: calc(var(--H) - 2px);
  background: #dcd6c6;
  z-index: 2;
  transition: opacity .6s;
}
.edge.el { left: 0; }
.edge.er { left: var(--W); }
.single .edge.er { display: none; }

.leaf {
  position: absolute;
  top: 0; left: 0;
  width: var(--W);
  height: var(--H);
  transform-origin: 100% 50%;
  transform-style: preserve-3d;
  transition: transform .95s var(--ease);
}
.leaf.flipped { transform: rotateY(180deg); }
.single .leaf.flipped { visibility: hidden; transition: transform .95s var(--ease), visibility 0s .95s; }
.single .leaf:not(.flipped) { visibility: visible; transition: transform .95s var(--ease), visibility 0s 0s; }
.leaf.cover {
  top: -5px; left: -5px;
  width: calc(var(--W) + 5px);
  height: calc(var(--H) + 10px);
}
.face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.face.back { transform: rotateY(180deg); }
.face::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(to right, rgba(20, 14, 6, .0), rgba(20, 14, 6, .42));
}
.face.back::after { background: linear-gradient(to left, rgba(20, 14, 6, .0), rgba(20, 14, 6, .42)); }
.leaf.turning .face::after { animation: shade .95s var(--ease); }
@keyframes shade { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 0; } }

/* 本文の紙 */
.pg {
  position: absolute;
  inset: 0;
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(120, 100, 60, .022) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, rgba(255, 255, 255, .25), transparent 14%, transparent 86%, rgba(90, 70, 30, .05));
}
.pg::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.pg.L::before { background: linear-gradient(to left, rgba(70, 55, 28, .26), rgba(70, 55, 28, .07) 8%, transparent 22%); }
.pg.R::before { background: linear-gradient(to right, rgba(70, 55, 28, .26), rgba(70, 55, 28, .07) 8%, transparent 22%); }
.pg.blank::after { content: none; }

.text {
  position: absolute;
  top: var(--vpad);
  width: var(--Tw);
  height: var(--Th);
  writing-mode: vertical-rl;
  font-family: var(--serif);
  font-size: var(--fs);
  line-height: var(--L);
  font-weight: 400;
  color: var(--ink);
  text-align: justify;
  text-justify: inter-character;
  line-break: strict;
  letter-spacing: 0;
}
.pg.L .text { right: var(--inner); }
.pg.R .text { left: var(--inner); }
.text.measure { position: fixed; left: -9999px; visibility: hidden; pointer-events: none; }
.text > * { margin: 0; }
.text > :first-child { margin-block-start: 0; }
.text .nar { text-indent: 1em; }
.text .dlg, .text .cont { text-indent: 0; }
.text .scene { margin-block: var(--L); text-indent: 0; text-align: center; color: var(--faint); }
.text .let { font-size: .94em; padding-inline-start: 2em; text-indent: 1em; }
.text .let.cont { text-indent: 0; }
.text .note { font-size: .92em; padding-inline-start: 1.6em; text-indent: 0; letter-spacing: .06em; color: #3b3832; }
.text .gap { block-size: calc(var(--L) * .6); }
.text .fin { margin-block-start: var(--L); text-indent: 0; text-align: end; color: var(--faint); }
.text h2 {
  margin: 0 0 calc(var(--L) * 1.5);
  padding-inline-start: calc(var(--fs) * 4);
  font-size: 1.4em;
  font-weight: 700;
  letter-spacing: .2em;
  line-height: var(--L);
}
.text h2 .no { display: inline-block; margin-block-end: .9em; color: var(--accent); }
.text h2 .ttl { display: inline-block; }
.text.colo p { text-indent: 0; text-align: end; }
.text.colo .ct { font-size: 1.15em; letter-spacing: .3em; font-weight: 500; }
.text.colo .cd { font-size: .8em; color: var(--faint); letter-spacing: .12em; }

.rh {
  position: absolute;
  top: calc(var(--vpad) * .6);
  writing-mode: vertical-rl;
  font-family: var(--serif);
  font-size: calc(var(--fs) * .62);
  letter-spacing: .32em;
  color: var(--faint);
  white-space: nowrap;
}
.pn {
  position: absolute;
  bottom: calc(var(--vpad) * .55);
  font-family: var(--serif);
  font-size: calc(var(--fs) * .66);
  letter-spacing: .08em;
  color: var(--faint);
}
.pg.L .rh, .pg.L .pn { left: calc(var(--outer) * .4); }
.pg.R .rh, .pg.R .pn { right: calc(var(--outer) * .4); }
.curl {
  position: absolute;
  left: 0; bottom: 0;
  width: calc(var(--W) * .075);
  aspect-ratio: 1;
  pointer-events: none;
  background: linear-gradient(45deg, rgba(60, 46, 20, .16) 0 50%, transparent 50%);
}

/* 見返し：藍の格子紙 */
.ep {
  background-color: #c6cfd9;
  background-image:
    repeating-linear-gradient(45deg, rgba(30, 48, 78, .17) 0 1px, transparent 1px 12px),
    repeating-linear-gradient(-45deg, rgba(30, 48, 78, .17) 0 1px, transparent 1px 12px);
}
.face.endpaper { background: var(--navy); }
.face.endpaper .ep { position: absolute; inset: 5px 5px 5px 0; }
.face.endpaper .ep::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(20, 30, 50, .34), rgba(20, 30, 50, .08) 9%, transparent 24%);
}
.board .ep::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to left, rgba(20, 30, 50, .34), rgba(20, 30, 50, .08) 9%, transparent 24%);
}

/* 表紙：藍の布、金の罫、題簽 */
.cv {
  position: absolute;
  inset: 0;
  border-radius: 5px 1px 1px 5px;
  background-color: var(--navy);
  background-image:
    linear-gradient(to left, rgba(0, 0, 0, .5) 0, rgba(0, 0, 0, .0) 6%),
    linear-gradient(to left, transparent 7.5%, rgba(255, 255, 255, .05) 7.5%, transparent 8.5%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 4px),
    radial-gradient(ellipse at 30% 25%, rgba(70, 100, 150, .22), transparent 70%);
}
.cv .frame {
  position: absolute;
  inset: 4.5% 11% 4.5% 6%;
  border: 1px solid var(--gold);
  opacity: .5;
}
.cv .label {
  position: absolute;
  right: 21%;
  top: 10%;
  padding: 1.3em .7em;
  writing-mode: vertical-rl;
  font-family: var(--serif);
  font-weight: 500;
  font-size: calc(var(--fs) * 1.35);
  letter-spacing: .38em;
  color: #1c1a17;
  background: #efe9d8;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .5);
}
.cv .label::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(40, 30, 10, .35);
}
.cv svg {
  position: absolute;
  left: 12%;
  bottom: 9%;
  width: 36%;
  height: auto;
  overflow: visible;
}

@media (prefers-reduced-motion: reduce) {
  .leaf, .book, .shadow { transition-duration: .01s !important; }
  .leaf.turning .face::after { animation: none; }
}

.home {
  position: fixed;
  top: max(10px, env(safe-area-inset-top));
  left: max(10px, env(safe-area-inset-left));
  z-index: 5000;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: #9aa1a8;
  opacity: .55;
  transition: opacity .2s, background .2s;
}
.home:hover, .home:focus-visible { opacity: 1; background: rgba(255, 255, 255, .08); outline: none; }
.home svg { width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>

<script id="data" type="application/json">[{"t": "ch", "no": "一", "title": "午後"}, {"t": "p", "c": "nar", "x": "紙魚堂の壁時計は、七分進んでいる。"}, {"t": "p", "c": "nar", "x": "店の奥、階段脇の柱に掛かった振り子式の時計だ。二階が店主の住まいで、階段はその入口にあたる急で狭い木の段である。文字盤は飴色に焼け、五十年ぶんの古本の埃を吸っている。僕がアルバイトを始めた最初の日、「あの時計、遅れてるんですか、進んでるんですか」と訊くと、店主の宇佐美恒一郎さんは帳場から顔も上げずに答えた。"}, {"t": "p", "c": "dlg", "x": "「進めてあるんだ。きっかり七分」"}, {"t": "p", "c": "nar", "x": "理由は、その日のうちに聞いた。亡くなった奥さんの和子さんは、何をするにも七分遅れる人だったそうだ。待ち合わせにも、開店の支度にも。恒一郎さんは結婚した年に時計を七分進め、和子さんが逝って七年が経った今も、直していない。"}, {"t": "p", "c": "dlg", "x": "「正しい時間が知りたけりゃ、腕時計を見ればいい」と恒一郎さんは言った。「壁の時計はな、待つ時間を教えてくれるもんだ」"}, {"t": "p", "c": "nar", "x": "久我蒼、大学三年、文学部。古い本の匂いが好きだというだけで面接に来た僕を、恒一郎さんは「理由はそれで十分だ」と言って雇ってくれた。先月には、バイト代に色をつけられんからと、使い込んだ手巻きの腕時計をくれた。こちらは一分の狂いもなく合わせてある。"}, {"t": "p", "c": "nar", "x": "十二月のその木曜日のことを、僕は今も順番に思い出せる。思い出さなければならない、と言ったほうが正しい。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "午後五時、恒一郎さんは棚の端から一冊の文庫本を抜いて、僕に差し出した。"}, {"t": "p", "c": "dlg", "x": "「持って帰れ」"}, {"t": "p", "c": "dlg", "x": "『冬の鳥』という題だった。著者は篠宮清。背表紙は日に焼け、カバーの角は丸く擦り切れている。値札はない。店の一番奥、「非売品」の札を立てた棚に、僕が来た頃からずっと挿さっていた本だ。"}, {"t": "p", "c": "dlg", "x": "「売り物じゃないって、前に」"}, {"t": "p", "c": "dlg", "x": "「だから、やるんだ」恒一郎さんは言った。「今夜読めとは言わん。そのうち読め。それと、明日は朝から出かける用がある。午前中、店を頼む。時間は、あとで言う」"}, {"t": "p", "c": "nar", "x": "七十四歳の店主は、頼みごとをするとき、決まって目を合わせない。僕は礼を言って、本を鞄の底にしまった。そのときは、気難しい人の気まぐれな親切だと思っただけだった。"}, {"t": "p", "c": "nar", "x": "帳場の電話が鳴ったのは、その直後だ。"}, {"t": "p", "c": "nar", "x": "白いコードレスだが、呼び出し音だけは昔のベルの音に設定してある。ジリリ、と一度鳴り、二度目が鳴り終わらないうちに、恒一郎さんは受話器を取っていた。店の端から歩いてきてでも、彼は必ずそうする。"}, {"t": "p", "c": "dlg", "x": "「紙魚堂です」"}, {"t": "p", "c": "nar", "x": "間違い電話でも、セールスでも、この名乗りを省いたところを僕は見たことがない。電話を切ってから、僕は言った。"}, {"t": "p", "c": "dlg", "x": "「恒一郎さん、いつも二コールで出ますよね」"}, {"t": "p", "c": "dlg", "x": "「三コール待たせたら、たいていの相手は切る」眼鏡を拭きながら、恒一郎さんは言った。「切られるのには慣れたが、こっちから出損なうのは性に合わん」"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "六時過ぎ、槇正光さんが来た。"}, {"t": "p", "c": "nar", "x": "槇さんは元警視庁の刑事で、七十六歳。定年から十六年、毎晩同じ時刻に紙魚堂へ来て、同じ椅子に座り、縁の欠けた湯呑みでほうじ茶を飲み、閉店と一緒に帰る。背が高く、少しも曲がっていない。コートの襟を立てる仕草に、現役の頃の名残がある。恒一郎さんとは四十年来の付き合いだと聞いていた。"}, {"t": "p", "c": "dlg", "x": "「蒼、いま何時だ」"}, {"t": "p", "c": "nar", "x": "槇さんは腕時計をしない。刑事を辞めたら時間に追われる理由がなくなった、というのが本人の弁だ。僕が壁の時計を見て「六時十分です」と答えると、槇さんは「七分引いて、六時三分か」と呟き、満足そうに椅子へ腰を下ろした。"}, {"t": "p", "c": "dlg", "x": "「相変わらず几帳面だな」と恒一郎さんが言う。「腕時計を買えばいい」"}, {"t": "p", "c": "dlg", "x": "「七分の引き算ができる頭は、まだ残ってる」"}, {"t": "p", "c": "dlg", "x": "「その頭で、煙草をやめて三年か。大したもんだ」"}, {"t": "p", "c": "dlg", "x": "「最初の一本が、いちばんまずいんだ。吸い始めたら、また一本目から数え直しになる」"}, {"t": "p", "c": "nar", "x": "二人は笑った。ほうじ茶の湯気の向こうに、僕はいつもの光景を見て、安心していた。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "宇佐美悟さんが現れたのは、閉店まで二時間ほどになった頃だ。"}, {"t": "p", "c": "nar", "x": "四十八歳。恒一郎さんの亡くなった弟の息子で、たった一人の血縁である。くたびれたジャンパーの下から安い酒の匂いをさせ、店に入るなり帳場へ手を差し出した。"}, {"t": "p", "c": "dlg", "x": "「十万でいい」"}, {"t": "p", "c": "dlg", "x": "「帰れ」"}, {"t": "p", "c": "dlg", "x": "「十万だ、叔父さん。次の給料日に返す」"}, {"t": "p", "c": "dlg", "x": "「この八年、返された金を見たことがない」"}, {"t": "p", "c": "nar", "x": "押し問答は短かった。恒一郎さんは一歩も動かず、悟さんは舌打ちをして、店の隅の槇さんを睨んだ。槇さんは湯呑みを持ったまま、一度も目を合わせなかった。"}, {"t": "p", "c": "dlg", "x": "「どうせ死んだら、この店は俺のもんだ」悟さんは出口で吐き捨てた。「さっさとくたばってくれりゃ、世話ねえんだけどな」"}, {"t": "p", "c": "dlg", "x": "「悟」"}, {"t": "p", "c": "nar", "x": "恒一郎さんの声は静かだった。「飯は食ってるのか」"}, {"t": "p", "c": "dlg", "x": "「……関係ねえだろ」"}, {"t": "p", "c": "nar", "x": "ドアのベルが乱暴に鳴った。これから友達と居酒屋で飲む、そのあとはパチンコだ、と悟さんは去り際に怒鳴っていた。恒一郎さんは、閉まったドアをしばらく見ていた。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "閉店は九時半。店の時計で、である。"}, {"t": "p", "c": "nar", "x": "僕は奥の机で帳簿をつけていた。その間、恒一郎さんと槇さんは帳場の脇で、低い声で何かを話していた。聞き取れなかった。昔の話をするときはいつもそうだから、気にも留めなかった。"}, {"t": "p", "c": "nar", "x": "九時半ちょうどに、槇さんが腰を上げた。いつものことだ。僕も鞄を持った。"}, {"t": "p", "c": "dlg", "x": "「気をつけて帰れ」恒一郎さんがドアまで見送りに出た。「明日、頼むぞ」"}, {"t": "p", "c": "nar", "x": "それが、生きている恒一郎さんを見た最後になった。"}, {"t": "p", "c": "nar", "x": "商店街の角で、槇さんと別れた。槇さんは右へ、僕は駅へ。「冷えるぞ、蒼。早く帰れ」と言った槇さんの息が、街灯の下で白かった。"}, {"t": "ch", "no": "二", "title": "夜"}, {"t": "p", "c": "nar", "x": "駅のホームで、僕は腕時計を見た。九時三十八分。"}, {"t": "p", "c": "nar", "x": "明日の出勤時間を、聞きそびれていた。午前中に店を頼む、時間はあとで言う、と恒一郎さんは言ったのに、帰りぎわには何も言われなかった。恒一郎さんは携帯電話を持っていない。僕は店に電話をかけた。"}, {"t": "p", "c": "nar", "x": "二コール目で、繋がった。"}, {"t": "p", "c": "dlg", "x": "「恒一郎さん、久我です。あの、明日なんですけど」"}, {"t": "p", "c": "nar", "x": "返事はなかった。"}, {"t": "p", "c": "dlg", "x": "『紙魚堂です』が、ない。それに気づいたのは、受話器の向こうの沈黙が、三秒か四秒続いてからだ。息を殺しているような、何かが動くような、よくわからない気配があって、「恒一郎さん？」と呼んだところで、通話は切れた。"}, {"t": "p", "c": "nar", "x": "具合でも悪いのだろうか。かけ直すと、今度は呼び出し音が十回、誰にも拾われないまま鳴り続けた。九時四十一分。電車が来たが、僕は乗らなかった。反対側のホームへ渡って、戻りの電車に乗った。"}, {"t": "p", "c": "nar", "x": "商店街に着いたのは十時十分だった。店のシャッターは半分降りていて、中の灯りがその下から漏れている。合鍵で入ると、帳場にも棚の間にも人影はなかった。"}, {"t": "p", "c": "nar", "x": "階段の下に、恒一郎さんが倒れていた。"}, {"t": "p", "c": "nar", "x": "うつ伏せで、片腕を体の下に折り、眼鏡が少し離れたところに転がっていた。そのすぐ脇に、壁から外れた時計が、文字盤を伏せるように落ちている。ガラスが砕けて、細かい破片が床に撒かれていた。"}, {"t": "p", "c": "nar", "x": "何と呼んだのか、覚えていない。肩に触れた。まだ温かかった。けれど、呼吸も、脈も、僕には探し当てられなかった。"}, {"t": "p", "c": "nar", "x": "百十九番にかけたのは十時十二分だった。電話の指示どおりに胸を押しながら、僕は目の端で店の中を見ていた。非売品の棚の端が、少し乱れているように見えた。何の関係もないことだと思った。"}, {"t": "p", "c": "nar", "x": "救急車の次に、槇さんに電話した。他に思いつく人がいなかった。"}, {"t": "p", "c": "dlg", "x": "「恒一郎さんが倒れてます。階段の下で。救急車を呼びました」"}, {"t": "p", "c": "nar", "x": "言えたのは、それだけだ。槇さんは「すぐ行く」とだけ答えた。"}, {"t": "p", "c": "nar", "x": "救急隊員は店に入ってすぐ、搬送を決めた。僕は救急車に同乗した。警察の人が来て、店の中へ入っていくのが、後部の窓から見えた。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "病院の待合室は、暖房が効きすぎていた。恒一郎さんの死亡が確認されたのは十一時七分だったと、あとで聞いた。僕は自動販売機の前の長椅子に座って、紙コップのお茶を握りしめていた。"}, {"t": "p", "c": "nar", "x": "槇さんが来たのは、その少し前、十時五十分頃だったと思う。コートの前を留めないまま、肩で息をしていた。警察の人が事情を聞きに来るより、ずっと前だった。"}, {"t": "p", "c": "nar", "x": "医師が出てきて、短く告げた。槇さんは何も言わず、僕の隣に腰を下ろした。長い時間のあと、天井を見たまま、独り言のように言った。"}, {"t": "p", "c": "dlg", "x": "「九時半にお前と別れてな。大通りのコンビニで、煙草を買った。三年ぶりだ。笑えるだろう。恒一郎が落ちた九時五十二分には、俺はまだ、コンビニの前に突っ立ってたんだよ」"}, {"t": "p", "c": "nar", "x": "三年やめていた煙草を、と僕は思った。この人が、と。何か言いたかったが、言葉にならなかった。槇さんは僕の肩を一度だけ叩いた。"}, {"t": "p", "c": "dlg", "x": "「お前のせいじゃない。誰のせいでもない。……いや、まだわからんがな」"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "十一時すぎに、所轄署の岸本という刑事が来た。三十代、細身で、疲れた目をしている。僕は聞かれるままに話した。閉店の九時半に槇さんと店を出たこと。九時三十八分に電話をしたこと。"}, {"t": "p", "c": "dlg", "x": "「繋がったんですね。そのとき、宇佐美さんは何か言いましたか」"}, {"t": "p", "c": "dlg", "x": "「いえ、何も。恒一郎さんは、電話に出たら必ず『紙魚堂です』と名乗る人なんです。それがなかった。息みたいな音だけで、すぐ切れて」"}, {"t": "p", "c": "dlg", "x": "「その時点では、ご存命だった」"}, {"t": "p", "c": "dlg", "x": "「……そう、だと思います」"}, {"t": "p", "c": "nar", "x": "岸本刑事は手帳に何かを書き込んだ。かけ直した電話が出なかったこと、それで引き返したことも、同じように書かれた。"}, {"t": "p", "c": "nar", "x": "時計の針が何時を指していたのかを、僕は見ていない。落ちた時計の破片を踏まないようにするだけで精一杯だった。警察がその時刻を確認したのは、日付が変わる少し前だったと、後になって岸本刑事は言った。"}, {"t": "ch", "no": "三", "title": "引き算"}, {"t": "p", "c": "nar", "x": "翌日から、商店街はいつもの顔をしていなかった。紙魚堂の入口には黄色いテープが張られ、シャッターの前に、花を手向ける人が列を作った。古い客も、近所の八百屋のおかみさんも、泣いている人が多かった。恒一郎さんがどれだけこの街の人だったのかを、僕は初めて知った。"}, {"t": "p", "c": "nar", "x": "金曜は一日、警察署で同じ話を三度した。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "土曜の昼、岸本刑事から電話があった。解剖の結果が出たという。死因は頭部の外傷で、階段からの転落と矛盾しない。死亡推定時刻は午後九時から十一時のあいだ。ただ、背中の中央に、掌ほどの打撲痕が見つかったそうだ。"}, {"t": "p", "c": "dlg", "x": "「転んだだけなら、背中にこの痕は付きにくい。誰かに押された可能性があります」"}, {"t": "p", "c": "nar", "x": "電話を切ると、すぐに槇さんから着信があった。「会えるか。ルノにいる」"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "喫茶「ルノ」は、商店街の裏手にある。槇さんの定位置は一番奥の席で、僕が入っていくと、彼はもうコーヒーを前にして、ノートを広げていた。昔の癖で、事件のことは手書きで整理しないと気が済まないのだという。"}, {"t": "p", "c": "dlg", "x": "「岸本から聞いた。あいつは、俺が捜査一課にいた頃の部下の、弟子みたいなもんでな。事件かどうか、俺の意見が聞きたいそうだ」槇さんは万年筆の先でノートを叩いた。「俺は、殺しだと思ってる」"}, {"t": "p", "c": "nar", "x": "ノートには、時刻が縦に並んでいた。"}, {"t": "gap"}, {"t": "p", "c": "note", "x": "二一・三八　蒼の電話が繋がる"}, {"t": "p", "c": "note", "x": "二一・四〇　悟、居酒屋「とり吉」を出る（連れの戸田が証言）"}, {"t": "p", "c": "note", "x": "二一・五〇　悟、パチンコ店に入店（会員カードの記録）"}, {"t": "p", "c": "note", "x": "二一・五二　紙魚堂の時計、停止"}, {"t": "gap"}, {"t": "p", "c": "dlg", "x": "「時計は九時五十二分で止まっていた。そのまま受け取れば、悟にはどうにもできない。パチンコ屋に入ったのが九時五十分だ。店から歩いて三分。九時五十二分に紙魚堂の階段にいるのは無理だ。だから警察は、事故の線を捨てきれずにいる」"}, {"t": "p", "c": "dlg", "x": "「でも、事故じゃないんですよね」"}, {"t": "p", "c": "dlg", "x": "「ああ。それで、蒼。あの時計は何分進んでる」"}, {"t": "p", "c": "nar", "x": "僕は息を呑んだ。"}, {"t": "p", "c": "dlg", "x": "「七分……」"}, {"t": "p", "c": "dlg", "x": "「七分だ。九時五十二分から七分引けば、九時四十五分」槇さんの万年筆が、その数字の上で止まった。「居酒屋から紙魚堂まで、歩いて五分。九時四十分に出た悟は、九時四十五分に店に着ける。階段の上から叔父を突き落として、店を出て、パチンコ屋まで三分。九時五十分に入店。……ぴたりと合う。ぴたりと合いすぎるくらいだ」"}, {"t": "p", "c": "dlg", "x": "「岸本さんは、時計が進んでいることを」"}, {"t": "p", "c": "dlg", "x": "「知らなかった。俺が言った。この街の人間なら誰でも知ってることだが、よその刑事は、壁の時計を疑わん。刑事の初歩は、時間を疑うことだ。まず自分の時計を、それから他人の時計を」"}, {"t": "p", "c": "nar", "x": "僕は、九時三十八分の電話のことを言った。"}, {"t": "p", "c": "dlg", "x": "「恒一郎さんは電話に出たのに、何も言わなかったんです。あの人が名乗らないなんて、ありえない」"}, {"t": "p", "c": "dlg", "x": "「具合が悪かったんだろう」槇さんは静かに言った。「年寄りが受話器を取って、声が出ないことくらいある。悟が来る前から、あいつは座り込むほど苦しかったのかもしれん。そこへ悟が来た。金をせびりにな。叔父は立っているのもやっとで、悟は逆上して……」"}, {"t": "p", "c": "dlg", "x": "「悟さんが、本当にそんなことを」"}, {"t": "p", "c": "dlg", "x": "「蒼」槇さんは僕を見た。「木曜の夕方、あいつはお前の前で何と言った。『さっさとくたばってくれ』だ。金はこの八年、一度も返していない。闇金に三百万の借りがあることも、岸本たちが調べ上げた」"}, {"t": "p", "c": "nar", "x": "僕は何も言えなかった。確かに悟さんは、そう言った。僕もこの耳で聞いたのだ。"}, {"t": "p", "c": "nar", "x": "槇さんは眼鏡を外して、目頭を押さえた。ポケットからハンカチを取り出すとき、封の切られていない煙草の箱が、一緒に引っかかって覗いた。槇さんはそれを黙って、内ポケットの奥へ押し戻した。"}, {"t": "p", "c": "dlg", "x": "「四十年だ」槇さんは掠れた声で言った。「あいつとは、四十年だった」"}, {"t": "p", "c": "nar", "x": "しばらくして、槇さんはいつもの調子に戻った。"}, {"t": "p", "c": "dlg", "x": "「ところで、蒼。恒一郎から、何か預かってないか」"}, {"t": "p", "c": "dlg", "x": "「預かる、ですか」"}, {"t": "p", "c": "dlg", "x": "「通帳でも、遺言でも、鍵でもいい。あの人は、このところ身辺を片付けているふうだった。そういうものが悟の手に渡る前に、確かめておきたい」"}, {"t": "p", "c": "nar", "x": "鞄の底の『冬の鳥』は、そのとき頭に浮かばなかった。通帳でも遺言でも鍵でもなかったからだ。"}, {"t": "p", "c": "dlg", "x": "「いえ、何も」"}, {"t": "p", "c": "dlg", "x": "「そうか」槇さんは頷いた。「ならいい」"}, {"t": "p", "c": "nar", "x": "槇さんは、自分の考えを岸本刑事に伝えると言った。僕は頷いた。頷くしかなかった。"}, {"t": "p", "c": "nar", "x": "ただ、帰り道に、ひとつだけ引っかかったことがある。木曜の午後、悟さんが去ったあとの、恒一郎さんの声だ。「飯は食ってるのか」。さっさとくたばってくれと吐き捨てられた人が、最初に口にした言葉が、それだった。"}, {"t": "p", "c": "nar", "x": "あの人は、殺されるほど憎まれていたのだろうか、と僕は思った。それとも、憎まれることに、慣れていたのだろうか。"}, {"t": "ch", "no": "四", "title": "一コール"}, {"t": "p", "c": "nar", "x": "月曜の朝、紙魚堂の前に、真壁志津さんが立っていた。"}, {"t": "p", "c": "nar", "x": "六十八歳。亡くなった和子さんの幼なじみで、毎週金曜に手作りの漬物を持ってくる常連だ。今日は菊の花束を抱えて、テープの前で、どこへ置けばいいのか決めかねていた。"}, {"t": "p", "c": "dlg", "x": "「ここでいいですよ」と僕は言って、シャッターの前の、花の山の端を示した。志津さんは頷き、花を置き、手を合わせてから、長いこと動かなかった。"}, {"t": "p", "c": "dlg", "x": "「ねえ、久我くん。あの人ね、十時になると電話の前に座るのよ」"}, {"t": "p", "c": "dlg", "x": "「十時、ですか」"}, {"t": "p", "c": "dlg", "x": "「閉店のあと。二階から降りてきて、帳場の電話の前に。毎晩ね、悟くんが電話をかけてくるの。一度鳴らして、切るだけ。もう八年になるわ」"}, {"t": "p", "c": "nar", "x": "僕は志津さんの顔を見た。"}, {"t": "p", "c": "dlg", "x": "「出ようとすると切れるんですって。話す勇気はないのよ、あの子も。でも毎晩、かけてくる。恒一郎さんは分かってるから、一度鳴ったら二度目には出られるように、ずっと待ってるの。昼間も二コール以内に必ず出るのは、そのせい。癖になっちゃったのね」"}, {"t": "p", "c": "nar", "x": "二コールで出る人。切られるのには慣れたが、出損なうのは性に合わん。恒一郎さんの言葉が、まるで違う意味を帯びて、僕の耳に戻ってきた。"}, {"t": "p", "c": "dlg", "x": "「悟くんがああなったのは、お父さんのことがあってからよ。大黒屋さんの火事で、隆二さんが捕まって、獄中で亡くなって。悟くんは十六だったかしら。それから、恒一郎さんにだけは、意地でも頭を下げなくなった」志津さんは目許を拭った。「待つのが上手な人だったわ、恒一郎さんは。和子さんの七分もそう。悟くんのこともそう。……あの子が人を殺すはずがない。私はそう思うの。でも、警察の人は聞いてくれなかった」"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "その夕方、悟さんが来た。"}, {"t": "p", "c": "nar", "x": "シャッターの前の花の山を、悟さんはポケットに手を入れたまま見下ろしていた。木曜と同じジャンパーで、髭が伸びている。僕に気づくと、舌打ちのような息を吐いた。"}, {"t": "p", "c": "dlg", "x": "「お前が、久我か」"}, {"t": "p", "c": "dlg", "x": "「……はい」"}, {"t": "p", "c": "dlg", "x": "「叔父さんのお気に入りの」悟さんは笑おうとして、失敗した。「警察が来た。昨日の夜と、今朝と。お前も、俺がやったと思ってんのか」"}, {"t": "p", "c": "nar", "x": "何と答えればいいのか分からなかった。悟さんは僕の沈黙を、そのまま受け取ったようだった。"}, {"t": "p", "c": "dlg", "x": "「やってねえよ。九時四十分に居酒屋を出てから、パチンコ屋に入るまでの十分間、どこにいたかって聞かれた。言えねえ。言う気もねえ。疑われんのは分かってる」"}, {"t": "p", "c": "dlg", "x": "「どうして、言えないんですか」"}, {"t": "p", "c": "dlg", "x": "「関係ねえだろ」木曜と同じ言葉を、悟さんは吐いた。"}, {"t": "p", "c": "nar", "x": "僕は迷って、結局、言った。"}, {"t": "p", "c": "dlg", "x": "「木曜の夕方、悟さんが帰ったあと、恒一郎さんが言ったんです。『飯は食ってるのか』って」"}, {"t": "p", "c": "nar", "x": "悟さんは動かなかった。ジャンパーの肩が、一度だけ、ひどく小さく上下した。"}, {"t": "p", "c": "dlg", "x": "「……あの人は、いつもそうだ」掠れた声だった。「金の話をしても、親父の話をしても、飯の心配だけだ。俺に何かしてくれたことなんて、一度も」"}, {"t": "p", "c": "nar", "x": "言葉はそこで途切れた。悟さんは背を向け、花の山の端に何かを置いた。缶コーヒーだった。それから、振り返らずに歩いていった。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "水曜日、悟さんが逮捕された。"}, {"t": "p", "c": "nar", "x": "知らせてくれたのは岸本刑事だった。紙魚堂の電話の着信履歴に、悟さんの携帯からの着信が、八年間、毎晩午後十時前後に一秒足らず、残っていたという。そして十二月の木曜日も、十時ちょうどに。"}, {"t": "p", "c": "dlg", "x": "「事件の夜にもかかっています。槇さんの言うとおり九時四十五分に突き落としたとすれば、その十五分後に、叔父の様子を確かめるように電話をかけたことになる」"}, {"t": "p", "c": "dlg", "x": "「……確かめる、ですか」"}, {"t": "p", "c": "dlg", "x": "「出ないことを、です」岸本刑事の声は事務的だった。「彼は居酒屋から消えた十分間の説明を拒んでいます。借金、動機、発言、時間。状況は揃っています。槇さんの指摘がなければ、事故で片付くところでした。さすがは元捜査一課です。ちなみに槇さんは、あなたと別れたあと、大通りのコンビニの防犯カメラに九時四十四分から五十八分まで映っていました。煙草を買って、店先で箱を眺めたまま、ずっと立ち尽くしていたそうです。年寄りの意地とか、後悔とか、そういう顔でした」"}, {"t": "p", "c": "dlg", "x": "「……そうですか」"}, {"t": "p", "c": "nar", "x": "電話を切ってから、しばらく動けなかった。"}, {"t": "p", "c": "nar", "x": "悟さんが犯人なら、すべてが綺麗に説明できる。時計も、時刻も、動機も、言葉も。説明できないのは、僕の胸の中だけだった。"}, {"t": "p", "c": "nar", "x": "その夜、十時に、灯りのついたままの店の帳場で、白い電話が一度だけ鳴って、切れたのだと思う。出ようとして出られなかった人の、すぐ側で。"}, {"t": "p", "c": "nar", "x": "僕はその晩、初めて泣いた。泣き止んでから、鞄の底に、まだ一ページも開いていない文庫本が入っていることを思い出した。"}, {"t": "ch", "no": "五", "title": "冬の鳥"}, {"t": "p", "c": "nar", "x": "その夜、僕は眠れないまま、あの木曜日を最初から並べ直した。槇さんがノートに時刻を書き並べたように。"}, {"t": "p", "c": "nar", "x": "九時三十八分。僕は店に電話をかけた。二コール目で繋がって、無言のまま、切れた。"}, {"t": "p", "c": "nar", "x": "岸本刑事に聞かれて、僕は答えた。恒一郎さんは、電話に出たら必ず名乗る人だ、と。それを岸本刑事は「その時点ではご存命だった」と書き留め、僕自身も、そうだと頷いた。"}, {"t": "p", "c": "nar", "x": "でも、本当にそうだろうか。"}, {"t": "p", "c": "nar", "x": "名乗らなかったのなら、出たのは恒一郎さんではない。"}, {"t": "p", "c": "nar", "x": "あのとき、受話器を取った誰かがいた。息を殺して、三秒か四秒、何も言わずに。そして僕が呼びかけると、切った。"}, {"t": "p", "c": "nar", "x": "それは誰だ。悟さんではない。悟さんは九時四十分まで居酒屋にいた。友人の戸田さんがそう証言している。居酒屋から紙魚堂まで、歩いて五分。九時三十八分の紙魚堂に、悟さんはいられない。"}, {"t": "p", "c": "nar", "x": "悟さんでないなら、あの店には、別の誰かがいたことになる。恒一郎さんが電話に出られない状態で、受話器を取ることのできる誰かが。"}, {"t": "p", "c": "nar", "x": "つまり、恒一郎さんは、九時三十八分の時点で、もう階段の下に倒れていたのだ。"}, {"t": "p", "c": "nar", "x": "では、あの時計は。"}, {"t": "p", "c": "nar", "x": "九時五十二分で止まっていた時計。七分引けば、九時四十五分。どちらも、九時三十八分より後だ。恒一郎さんが九時三十八分にすでに倒れていたのなら、時計が壁から落ちたのも、それより前でなければおかしい。あの時計は、落ちた瞬間に止まったのではない。誰かが、針を動かして、止めたのだ。"}, {"t": "p", "c": "nar", "x": "九時五十二分。そこから七分引いて、九時四十五分。悟さんが居酒屋を出てからパチンコ屋に入るまでの十分間に、ちょうど収まる時刻。"}, {"t": "p", "c": "nar", "x": "ぴたりと合いすぎるくらいだ、と槇さんは言った。"}, {"t": "p", "c": "nar", "x": "その槇さんの言葉に、僕はもうひとつ、思い当たった。"}, {"t": "p", "c": "nar", "x": "病院の長椅子。恒一郎さんの死亡が告げられたあとで、槇さんは天井を見たまま言った。恒一郎が落ちた九時五十二分には、俺はまだ、コンビニの前に突っ立ってたんだよ、と。"}, {"t": "p", "c": "nar", "x": "九時五十二分。"}, {"t": "p", "c": "nar", "x": "あのとき、僕は時計の針を見ていなかった。見ていない僕が、槇さんに時刻を教えられるはずがない。警察が針を確認して、岸本刑事に報告が入ったのは、日付が変わる少し前だった。槇さんが病院に着いたのは十時五十分。あの言葉を口にしたのは、その十分か十五分後だ。"}, {"t": "p", "c": "nar", "x": "槇さんは、まだ誰も知らないはずの時刻を、知っていた。"}, {"t": "p", "c": "nar", "x": "背筋が冷たくなった。いちばん遠くにあると思っていた線が、いちばん手前で繋がっていた。九時半に僕と別れたはずの人が、九時三十八分の店の中にいた。それなら、あのコンビニは。三年ぶりに買ったという煙草は。封の切られていない箱は。店先で箱を眺めたまま、十四分間立ち尽くしていたという姿は。"}, {"t": "p", "c": "nar", "x": "土曜日の「ルノ」で、槇さんが訊いたことも思い出した。恒一郎から何か預かってないか。通帳でも、遺言でも、鍵でもいい、と。"}, {"t": "p", "c": "nar", "x": "僕は、鞄を引き寄せた。"}, {"t": "sc"}, {"t": "p", "c": "dlg", "x": "『冬の鳥』は、驚くほど軽かった。表紙を開くと、扉の余白に、鉛筆で薄く何かを消した跡がある。読むつもりはなかった。ただ、最後の頁をめくった。"}, {"t": "p", "c": "nar", "x": "見返しの裏に、茶封筒が、糊で軽く貼りつけてあった。"}, {"t": "p", "c": "nar", "x": "中身は、便箋が三枚と、小さなカードが一枚。便箋の文字は震えて、細く、古い人の字だった。"}, {"t": "gap"}, {"t": "p", "c": "let", "x": "宇佐美恒一郎様"}, {"t": "p", "c": "let", "x": "突然のお手紙をお許しください。私は昔、質屋の大黒屋で女中をしておりました、長谷部ミツと申します。医者から、この冬は越せないと言われました。それで、死ぬ前に、ひとつだけ、お伝えしなければならないことがございます。"}, {"t": "p", "c": "let", "x": "平成六年の十一月三日の夜、大黒屋に火が出ました。あの晩、私は裏の勝手口から、背の高い男の人が走って出ていくのを見ました。隆二さんではございません。隆二さんは小柄な方です。"}, {"t": "p", "c": "let", "x": "翌朝、私はそのことを、聞き取りに来られた若い刑事さんにお話ししました。槇という刑事さんでした。寒い朝で、その方はコートの襟を立てて、私の話を聞いてくださいました。そして手帳に何か書いて、そのページを破り、丸めてポケットにしまわれました。「隆二はもう自白している。余計なことは言わなくていい」とおっしゃいました。"}, {"t": "p", "c": "let", "x": "私は怖くて、三十年、黙っておりました。隆二さんが獄中で亡くなったと聞いたとき、私も一緒に死んだ気がいたしました。"}, {"t": "p", "c": "let", "x": "どうか、お許しください。そして、どうか、本当のことを。"}, {"t": "p", "c": "let", "x": "長谷部ミツ"}, {"t": "gap"}, {"t": "p", "c": "nar", "x": "カードは、見慣れた字だった。恒一郎さんの、右上がりの、少し乱暴な字。"}, {"t": "gap"}, {"t": "p", "c": "let", "x": "久我くん。"}, {"t": "p", "c": "let", "x": "この本と手紙を、悟に渡してくれ。"}, {"t": "p", "c": "let", "x": "私が黙っていたことを、あいつは許さんだろう。それでいい。"}, {"t": "p", "c": "let", "x": "明日、槇に話す。今夜、話す。四十年の付き合いだ。先に私の口から言うのが筋だと思う。"}, {"t": "p", "c": "let", "x": "もし私に何かあったら、この手紙を警察に。"}, {"t": "p", "c": "let", "x": "それと、もし槇が自分から話す気になったなら、七分、待ってやってくれ。"}, {"t": "p", "c": "let", "x": "あいつなら、七分あれば足りる。"}, {"t": "p", "c": "let", "x": "店は、頼む。"}, {"t": "p", "c": "let", "x": "宇佐美恒一郎"}, {"t": "gap"}, {"t": "p", "c": "nar", "x": "恒一郎さんは、渡すときに目を合わせなかった。持って帰れ、と言った。今夜読めとは言わん、と言った。"}, {"t": "p", "c": "nar", "x": "僕は、七分、という一行を、何度も読んだ。腕時計を見ると、午前三時を回っていた。こちらの時計は、一分の狂いもなく合わせてある。"}, {"t": "ch", "no": "六", "title": "七分間"}, {"t": "p", "c": "nar", "x": "翌朝、僕は岸本刑事に電話をかけた。順序立てて話したつもりだったが、半分は声が震えていた。"}, {"t": "p", "c": "nar", "x": "岸本刑事は黙って聞いたあと、「槇さんに時計の時刻をお伝えしたのは、土曜の朝です」とだけ言った。「それより前に伝えた覚えは、ありません」"}, {"t": "p", "c": "nar", "x": "手紙は、筆跡と消印から、長谷部ミツさん本人のものと確認された。ミツさんが今年の秋に亡くなっていることも。それでも岸本刑事は慎重だった。手紙は三十年前の話であり、時計の件は推測にすぎない、と。"}, {"t": "p", "c": "dlg", "x": "「槇さんに、話をさせてください」と僕は言った。「恒一郎さんが、頼んだことなんです」"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "金曜の夜、九時過ぎ。紙魚堂は、警察の許可を得て、一晩だけ灯りをともした。階段脇の柱には、時計の形に日焼けの跡が白く残っている。岸本刑事は、僕がいつも帳簿をつけていた奥の机の陰で、息を殺していた。"}, {"t": "p", "c": "nar", "x": "槇さんは、いつもの時刻に来た。"}, {"t": "p", "c": "nar", "x": "ドアのベルが鳴って、コートの襟を立てた姿が現れた。"}, {"t": "p", "c": "dlg", "x": "「呼び出しとは、珍しいな。悟のことか」"}, {"t": "p", "c": "dlg", "x": "「はい。座ってください」"}, {"t": "p", "c": "nar", "x": "槇さんはいつもの椅子に腰を下ろした。僕は欠けた湯呑みにほうじ茶を注いで、前に置いた。槇さんは湯呑みを見て、それから壁の白い跡を見た。"}, {"t": "p", "c": "dlg", "x": "「……蒼。いま何時だ」"}, {"t": "p", "c": "nar", "x": "壁の時計のない店で、槇さんは初めて、答えを探して目を泳がせた。"}, {"t": "p", "c": "dlg", "x": "「九時十五分です」僕は腕時計を見て答えた。「恒一郎さんにもらった時計です。これは、狂ってません」"}, {"t": "p", "c": "dlg", "x": "「そうか」槇さんは少しだけ笑った。「引き算が要らんのは、楽でいい」"}, {"t": "p", "c": "dlg", "x": "「今日は、槇さんの引き算を、僕にやらせてください」"}, {"t": "p", "c": "nar", "x": "槇さんの笑みが、そこで止まった。"}, {"t": "p", "c": "nar", "x": "僕は順に話した。"}, {"t": "p", "c": "nar", "x": "九時三十八分の電話のこと。二コール目で繋がったのに、名乗りがなかったこと。悟さんは九時四十分まで居酒屋にいたこと。つまり、あの時刻に店にいたのは、悟さんではない誰かだということ。"}, {"t": "p", "c": "dlg", "x": "「具合の悪かった恒一郎が、声を出せなかっただけだと、言ったはずだ」"}, {"t": "p", "c": "dlg", "x": "「声が出ない人が、受話器を取れますか」僕は言った。「それに、あの沈黙は三秒か四秒ありました。僕が『久我です』と言ってから、『恒一郎さん？』と呼ぶまで。切れたのは、呼んだ瞬間です。あれは、病気の人の沈黙じゃない。聞き耳を立てていた人の沈黙です。相手が誰なのか、確かめていた」"}, {"t": "p", "c": "nar", "x": "槇さんは何も言わなかった。"}, {"t": "p", "c": "dlg", "x": "「時計もです。九時四十五分でも九時五十二分でも、九時三十八分より後です。恒一郎さんがその前に倒れていたのなら、時計の止まった時刻は嘘になる。針を動かした人がいる。それを、七分の引き算で意味のある時刻に見せたのは、槇さんです」"}, {"t": "p", "c": "dlg", "x": "「推測だ」槇さんの声は低かった。「蒼。そういう話を、俺は何度も聞いてきた。筋は通って見える。だが、証拠がない」"}, {"t": "p", "c": "dlg", "x": "「病院です」"}, {"t": "p", "c": "nar", "x": "槇さんの目が、わずかに動いた。"}, {"t": "p", "c": "dlg", "x": "「十時五十分に着いた槇さんは、待合室で、僕に言いました。恒一郎が落ちた九時五十二分には、俺はまだ、コンビニの前に突っ立ってたって。あのとき、僕は時計の針を見ていませんでした。警察が時刻を確認して岸本刑事に伝わったのは、零時前です。岸本刑事が槇さんにお伝えしたのは、土曜の朝です」"}, {"t": "p", "c": "dlg", "x": "「……岸本から聞いたんだ。もっと前に」"}, {"t": "p", "c": "dlg", "x": "「岸本さんに確認しました」"}, {"t": "p", "c": "nar", "x": "槇さんは唇を結んだ。"}, {"t": "p", "c": "dlg", "x": "「コンビニの防犯カメラには、煙草を買って、箱を眺めたまま十四分立っている槇さんが映っているそうです。土曜日の『ルノ』で、ハンカチと一緒に見えた箱は、封が切られていませんでした。三年ぶりに吸いたくなって買った人が、その十四分間、一本も吸わなかった。あれは、吸うための煙草じゃない。カメラに映るための、時間だったんじゃないですか」"}, {"t": "p", "c": "nar", "x": "槇さんは湯呑みに手を伸ばして、触れて、引っ込めた。"}, {"t": "p", "c": "dlg", "x": "「それから、『何か預かってないか』と訊かれたこと。通帳でも遺言でも鍵でもいい、と。槇さんは、あの夜、店のどこかを探したんですね。何を探していたのか、僕は昨日まで知りませんでした」"}, {"t": "p", "c": "nar", "x": "僕は鞄から『冬の鳥』を出して、帳場の上に置いた。"}, {"t": "p", "c": "nar", "x": "日に焼けた背表紙。擦り切れたカバー。槇さんは、それを見つめた。長い時間だった。"}, {"t": "p", "c": "dlg", "x": "「……その本か」"}, {"t": "p", "c": "dlg", "x": "「恒一郎さんは、あの日の午後、僕に渡しました。売り物じゃないから、やる、と」"}, {"t": "p", "c": "dlg", "x": "「俺は探した」槇さんは本から目を離さずに言った。「あの夜、棚の端から端まで。非売品の棚の本も、全部引き抜いた。あの本の背表紙も、何度も見ているはずだ。毎晩この店で見ていた本だ。三十年、一度も手に取ったことのない本だ」"}, {"t": "p", "c": "nar", "x": "槇さんは、ゆっくりと笑った。笑ったというより、顔の筋肉が、笑いの形に動いただけだった。"}, {"t": "p", "c": "dlg", "x": "「恒一郎め。先に、お前に渡していたのか」"}, {"t": "p", "c": "dlg", "x": "「手紙は読みました。長谷部ミツさんの。恒一郎さんからのカードも」僕は腕時計を見た。「そこに、書いてありました。槇さんが自分から話す気になったなら、七分、待ってやってくれ、と。あいつなら、七分あれば足りる、と」"}, {"t": "p", "c": "nar", "x": "槇さんが顔を上げた。"}, {"t": "p", "c": "dlg", "x": "「だから、待ちます」僕は言った。「七分。九時二十一分から、九時二十八分まで」"}, {"t": "p", "c": "nar", "x": "僕は、それ以上何も言わなかった。"}, {"t": "p", "c": "nar", "x": "壁の白い跡の前で、時間が流れた。商店街の遠くで、シャッターを下ろす音がした。一分。二分。三分。四分。奥の机の陰で、岸本刑事の気配が揺れた。五分。六分。槇さんは目を閉じていた。"}, {"t": "p", "c": "nar", "x": "七分目に入ったとき、槇さんが口を開いた。"}, {"t": "p", "c": "dlg", "x": "「……あいつの時計は、七分進んでいた」"}, {"t": "p", "c": "nar", "x": "誰に言うともない声だった。"}, {"t": "p", "c": "dlg", "x": "「三十年、通い続けて、俺は一度も、あの時計を正しく読まなかった。引き算ばかりしてきた。あいつの弟のこともそうだ。隆二は小柄な男だった。ミツ婆さんが見たのは、背の高い男だった。大黒屋の火事の翌朝、俺はそれを聞いた。聞いて、紙を破った」"}, {"t": "p", "c": "dlg", "x": "「どうして」"}, {"t": "p", "c": "dlg", "x": "「隆二は俺の担当だった。前の晩に、別件で絞った男だ。動機はあった。取調べで、あっさり落ちた。課長が褒めた。若い俺は、嬉しかった。それだけだ。それだけのことで、三十年だ」"}, {"t": "p", "c": "nar", "x": "槇さんは小さく息を吸った。"}, {"t": "p", "c": "dlg", "x": "「隆二が獄中で死んだと知ったとき、俺はこの店に来た。恒一郎に顔向けができなかった。それでも来た。次の日も来た。毎晩、湯呑みを前にして、いつ言われるか、いつバレるかと思ってた。十六年だ。毎晩、お前と笑いながらな」"}, {"t": "p", "c": "nar", "x": "僕は何も言えなかった。"}, {"t": "p", "c": "dlg", "x": "「木曜の夜、お前を帰したあとで、恒一郎が言った。ミツさんの手紙が来た、と。明日、弁護士に会う、と。静かな声だった。責めもしなかった。ただ、先にお前の口から聞きたかった、と。それで俺は、お前と別れた角から引き返した。裏口を叩いたら、あいつは開けた。話をしに戻ったと思ったんだろう」"}, {"t": "p", "c": "nar", "x": "槇さんの手が、膝の上で震えていた。"}, {"t": "p", "c": "dlg", "x": "「あいつは階段の三段目で、俺に背を向けた。話はもう終わりだ、という背中だった。気づいたときには、あいつは階段の下にいた。俺の手が、前に出ていた」"}, {"t": "p", "c": "nar", "x": "岸本刑事が、息を詰めたのが分かった。"}, {"t": "p", "c": "dlg", "x": "「それから、刑事の頭が動いた。笑えるだろう。四十年、人に時間を疑えと教えてきた男が、時計に頼った。階段脇の時計を外して、振り子を止めて、針を九時五十二分に合わせて、床に落として割った。七分進んでるのは誰でも知ってる。七分引けば、九時四十五分。どっちでも、俺はカメラの中にいる。二重に守ったつもりだった」"}, {"t": "p", "c": "dlg", "x": "「電話は」"}, {"t": "p", "c": "dlg", "x": "「九時三十八分に鳴った。静かな店に、あのベルがな。二度目が鳴り終わらないうちに、俺は受話器を取っていた。四十年あいつの隣で見てきた癖が、移ってたんだ」槇さんは目を閉じたまま言った。「お前の声がした。久我です、と。あの声で、初めて、自分が何をやったのか分かった。『恒一郎さん？』と呼ばれて、切った」"}, {"t": "p", "c": "dlg", "x": "「悟さんを」僕の声は掠れていた。「どうして、悟さんに」"}, {"t": "p", "c": "dlg", "x": "「選んだわけじゃない。一番疑われる男だった。借金も、口も悪い。それが言い訳だと、自分でも分かってた。隆二の息子に、もう一度、同じことをしようとしてた」"}, {"t": "p", "c": "nar", "x": "それから槇さんは、内ポケットに手を入れて、封の切られていない煙草の箱を取り出し、帳場の上に置いた。『冬の鳥』の隣に。"}, {"t": "p", "c": "dlg", "x": "「一本も吸えなかった。吸ったら、また一本目から数え直しだ。その数え直しを、俺はもう、始められる気がしなかった」"}, {"t": "p", "c": "nar", "x": "奥の机の陰から、岸本刑事が静かに立ち上がった。槇さんは振り向かなかった。"}, {"t": "p", "c": "dlg", "x": "「岸本。聞こえたな」"}, {"t": "p", "c": "dlg", "x": "「……はい」"}, {"t": "p", "c": "dlg", "x": "「全部、本当だ。俺の名前で、調書を取れ」"}, {"t": "p", "c": "nar", "x": "槇さんはゆっくりと立ち上がった。コートの襟を立てる仕草は、いつものままだった。岸本刑事に促されて入口に向かい、ドアのベルの前で立ち止まった。"}, {"t": "p", "c": "dlg", "x": "「蒼」背を向けたまま、槇さんは言った。「いま何時だ」"}, {"t": "p", "c": "nar", "x": "僕は腕時計を見た。"}, {"t": "p", "c": "dlg", "x": "「九時四十分です」"}, {"t": "p", "c": "dlg", "x": "「そうか」槇さんは、少しだけ肩を揺らした。「引かなくていいのは、楽なもんだ」"}, {"t": "p", "c": "nar", "x": "ベルが鳴って、冬の夜に、背の高い影が出ていった。"}, {"t": "ch", "no": "七", "title": "二コール目"}, {"t": "p", "c": "nar", "x": "槇さんは起訴され、罪を認めた。三十年前の火事についても、すべてを話したと聞いた。隆二さんの再審を求める準備が始まっている。悟さんは十二日目に釈放された。"}, {"t": "p", "c": "nar", "x": "三月、紙魚堂は再び店を開けた。"}, {"t": "p", "c": "nar", "x": "壁の柱には、時計が掛かっている。警察から戻ってきた時計は、ガラスを入れ替え、振り子を直し、僕が毎週木曜の夜にねじを巻いている。針は、七分進めてある。"}, {"t": "p", "c": "dlg", "x": "「直さないの？」と志津さんが訊いた。金曜日の午後、漬物の包みを帳場に置きながら。"}, {"t": "p", "c": "dlg", "x": "「このままにします」と僕は言った。「七分は、待つための時間だって、恒一郎さんが」"}, {"t": "p", "c": "nar", "x": "志津さんは笑って、目許を拭った。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "悟さんが現れたのは、その日の夕方だった。"}, {"t": "p", "c": "nar", "x": "ドアのベルが鳴って、しばらく誰も入ってこなかった。顔を上げると、悟さんが敷居の外に立っていた。ジャンパーの下に、洗い立てのシャツを着ている。"}, {"t": "p", "c": "dlg", "x": "「入っていいのか」"}, {"t": "p", "c": "dlg", "x": "「ここは、悟さんの店です」"}, {"t": "p", "c": "dlg", "x": "「……まだ手続きが終わってねえ」"}, {"t": "p", "c": "nar", "x": "悟さんは、二歩だけ入って、そこで止まった。棚を見回して、帳場を見て、壁の時計を見た。"}, {"t": "p", "c": "dlg", "x": "「あの夜」と悟さんは言った。「九時四十分に居酒屋を出てから、俺はこの店の前まで来たんだ」"}, {"t": "p", "c": "nar", "x": "僕は黙って聞いた。"}, {"t": "p", "c": "dlg", "x": "「灯りがついてた。ガラス戸の向こうに、叔父さんの帳場が見えた。謝ろうと思った。八年間、金をせびるだけで、顔も見ずに帰ってた。木曜の、あの『さっさとくたばれ』を。ドアに手をかけて、二分。たった二分だ。入れなかった。パチンコ屋で玉を弾きながら、あの二分のことを考えてた」"}, {"t": "p", "c": "nar", "x": "悟さんの声は、乾いていた。"}, {"t": "p", "c": "dlg", "x": "「あのとき入ってりゃ、叔父さんは……」"}, {"t": "p", "c": "dlg", "x": "「悟さん」僕は言った。「槇さんは、その前にもう」"}, {"t": "p", "c": "dlg", "x": "「分かってる。分かってるよ」悟さんは首を振った。「それでも、考える」"}, {"t": "p", "c": "nar", "x": "僕は帳場の下から、『冬の鳥』を出した。"}, {"t": "p", "c": "dlg", "x": "「恒一郎さんが、悟さんに渡してくれと」"}, {"t": "p", "c": "nar", "x": "悟さんは受け取って、カバーの擦り切れた角を、親指で撫でた。それから、見返しに挟んであったカードを読んだ。長い時間、読んでいた。読み終わってからも、顔を上げなかった。"}, {"t": "p", "c": "dlg", "x": "「……毎年な」悟さんは言った。「誕生日に、差出人のない荷物が届いたんだ。中身は古本だった。気持ち悪くて、読まずに積んである。全部、叔父さんだったのか」"}, {"t": "p", "c": "dlg", "x": "「たぶん」"}, {"t": "p", "c": "dlg", "x": "「電話もだ」悟さんは、白いコードレスを見た。「毎晩、一度だけ鳴らしてた。出られたら、何を話せばいいか分からなかった。出ない、と思いたかった。出ないから、鳴らせたんだ」"}, {"t": "p", "c": "dlg", "x": "「出ようとしてたそうです」と僕は言った。「恒一郎さんは。二度目のベルが鳴り終わらないうちに、必ず受話器を取れるように。ずっと、待ってたって」"}, {"t": "p", "c": "nar", "x": "悟さんは、動かなかった。"}, {"t": "p", "c": "dlg", "x": "「一回で切るのを、八年。二回目まで、待てばよかったのか」"}, {"t": "p", "c": "nar", "x": "返事ができなかった。悟さんは本を胸に抱くようにして、笑おうとして、また失敗した。"}, {"t": "sc"}, {"t": "p", "c": "nar", "x": "その夜、悟さんが帰ったあと、僕は一人で帳簿をつけた。"}, {"t": "p", "c": "nar", "x": "閉店は九時半。店の時計で、だ。ほうじ茶を淹れて、欠けた湯呑みは棚の奥にしまった。ほかに洗うものはなかった。"}, {"t": "p", "c": "nar", "x": "壁の時計が、十時七分を指していた。本当の時刻は、十時ちょうどだ。"}, {"t": "p", "c": "nar", "x": "帳場の電話が鳴った。"}, {"t": "p", "c": "nar", "x": "ジリリ、と。一度。"}, {"t": "p", "c": "nar", "x": "僕は受話器の前に立っていた。手は、もう動いていた。"}, {"t": "p", "c": "nar", "x": "二度目のベルが、鳴り始めた。"}, {"t": "p", "c": "nar", "x": "鳴り終わらないうちに、受話器を取った。"}, {"t": "p", "c": "dlg", "x": "「紙魚堂です」"}, {"t": "p", "c": "nar", "x": "向こうで、誰かが息を吸う気配がした。八年間、一度も続かなかった呼び出し音の、その先の沈黙だった。"}, {"t": "p", "c": "dlg", "x": "「……………飯は」と、声が言った。「飯は、食ってるのか」"}, {"t": "p", "c": "nar", "x": "僕は壁の時計を見た。七分進んだ針が、ゆっくりと、今を追い越していくところだった。"}, {"t": "p", "c": "dlg", "x": "「食べてます」と僕は答えた。「悟さんは」"}, {"t": "p", "c": "fin", "x": "了"}]</script>
<script>
(function () {
  var BLOCKS = JSON.parse(document.getElementById('data').textContent);
  var stage = document.getElementById('stage');
  var root = document.documentElement;
  var TITLE = '七分遅れの時計';
  var G, pages = [], leaves = [], s = 0, mode = 'spread', book, mb, lastTurn = 0;

  function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  /* 判型と文字組み：版面は行数・字数が整数になるよう寸法を決める */
  function geometry() {
    var vw = innerWidth, vh = innerHeight, r = 0.68;
    var H = Math.min(vh - 56, (vw - 56) / (2 * r));
    var spread = vw >= 820 && H >= 430;
    var W, fs;
    if (spread) {
      H = Math.floor(H); W = Math.floor(H * r);
      fs = Math.max(14, Math.round(H * 0.0275));
    } else {
      // 一枚ずつ見せる：画面の高さいっぱいに使い、幅は画面に合わせる
      H = Math.floor(vh - 28);
      W = Math.floor(Math.min(vw - 20, H * r));
      fs = Math.max(15, Math.round((W / r) * 0.031));
    }
    var L = Math.round(fs * 1.95);
    var n = Math.floor((W * 0.80) / L);
    var Tw = n * L;
    var m = Math.floor((H * 0.86) / fs);
    var Th = m * fs;
    var rem = W - Tw;
    var inner = Math.round(rem * 0.58);
    return { H: H, W: W, fs: fs, L: L, Tw: Tw, Th: Th, inner: inner, outer: rem - inner, vpad: Math.round((H - Th) / 2), spread: spread };
  }
  function applyVars() {
    var v = { W: G.W, H: G.H, fs: G.fs, L: G.L, Tw: G.Tw, Th: G.Th, inner: G.inner, outer: G.outer, vpad: G.vpad };
    for (var k in v) root.style.setProperty('--' + k, v[k] + 'px');
  }

  /* 本文をページに流し込む：測って、溢れたら行末で割る */
  function makeEl(it) {
    var b = it.b, el;
    if (b.t === 'ch') { el = document.createElement('h2'); el.innerHTML = '<span class="no">' + b.no + '</span><span class="ttl">' + esc(b.title) + '</span>'; }
    else if (b.t === 'sc') { el = document.createElement('p'); el.className = 'scene'; el.textContent = '＊'; }
    else if (b.t === 'gap') { el = document.createElement('div'); el.className = 'gap'; }
    else { el = document.createElement('p'); el.className = b.c + (it.off > 0 ? ' cont' : ''); el.textContent = it.x; }
    return el;
  }
  function over(el) { return el.getBoundingClientRect().left < mb.getBoundingClientRect().left - 0.5; }

  function paginate() {
    var out = [], cur = [], chapter = '';
    var q = BLOCKS.map(function (b, i) { return { b: b, i: i, off: 0, x: b.x }; });
    mb.innerHTML = '';
    function commit() {
      var carry = null;
      if (cur.length > 1 && cur[cur.length - 1].b.t === 'ch') carry = cur.pop();
      if (cur.length) {
        var first = cur[0];
        out.push({ items: cur, rh: first.b.t === 'ch' ? '' : chapter, key: first.i * 100000 + first.off });
        cur.forEach(function (it) { if (it.b.t === 'ch') chapter = it.b.title; });
      }
      cur = []; mb.innerHTML = '';
      if (carry) { cur.push(carry); mb.appendChild(makeEl(carry)); }
    }
    while (q.length) {
      var it = q.shift();
      if (it.b.t === 'ch' && cur.length) commit();
      if (it.b.t === 'gap' && !cur.length) continue;
      var el = makeEl(it);
      mb.appendChild(el);
      if (!over(el)) { cur.push(it); continue; }
      if (it.b.t === 'p' && it.x.length > 1) {
        var lo = 0, hi = it.x.length - 1;
        while (lo < hi) {
          var mid = Math.ceil((lo + hi) / 2);
          el.textContent = it.x.slice(0, mid);
          if (over(el)) hi = mid - 1; else lo = mid;
        }
        if (lo >= 4) {
          cur.push({ b: it.b, i: it.i, off: it.off, x: it.x.slice(0, lo) });
          q.unshift({ b: it.b, i: it.i, off: it.off + lo, x: it.x.slice(lo) });
          commit();
          continue;
        }
      }
      mb.removeChild(el);
      if (cur.length) { commit(); q.unshift(it); }
      else { cur.push(it); mb.appendChild(el); }
    }
    if (cur.length) commit();
    pages = out;
  }

  /* 各面のHTML */
  function itemHTML(it) {
    var b = it.b;
    if (b.t === 'ch') return '<h2><span class="no">' + b.no + '</span><span class="ttl">' + esc(b.title) + '</span></h2>';
    if (b.t === 'sc') return '<p class="scene">＊</p>';
    if (b.t === 'gap') return '<div class="gap"></div>';
    return '<p class="' + b.c + (it.off > 0 ? ' cont' : '') + '">' + esc(it.x) + '</p>';
  }
  function faceHTML(i, side) {
    var curl = side === 'L' ? '<i class="curl"></i>' : '';
    if (i < pages.length) {
      var p = pages[i];
      return '<div class="pg ' + side + '"><div class="text">' + p.items.map(itemHTML).join('') + '</div>' +
        (p.rh ? '<div class="rh">' + esc(p.rh) + '</div>' : '') + '<div class="pn">' + (i + 1) + '</div>' + curl + '</div>';
    }
    if (i === pages.length) {
      return '<div class="pg ' + side + '"><div class="text colo"><p class="ct">' + TITLE + '</p><p class="cd">二〇二六年十一月三日　初版</p></div>' + curl + '</div>';
    }
    return '<div class="pg ' + side + ' blank">' + curl + '</div>';
  }
  function coverHTML() {
    var ticks = '';
    for (var a = 0; a < 12; a++) {
      var big = a % 3 === 0;
      ticks += '<line x1="50" y1="' + (big ? 7 : 9) + '" x2="50" y2="' + (big ? 14 : 12.5) + '" transform="rotate(' + (a * 30) + ' 50 50)" />';
    }
    var clock = '<svg viewBox="0 0 100 100" fill="none" stroke="#c8ad6e" stroke-width=".9" stroke-linecap="round" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="44" opacity=".75"/>' + ticks +
      '<line x1="50" y1="50" x2="50" y2="17" opacity=".95"/>' +
      '<line x1="50" y1="50" x2="50" y2="17" transform="rotate(42 50 50)" stroke-dasharray="1.6 2.6" opacity=".7"/>' +
      '<line x1="50" y1="50" x2="26" y2="36" stroke-width="1.6" opacity=".95"/>' +
      '<circle cx="50" cy="50" r="1.8" fill="#c8ad6e" stroke="none"/></svg>';
    return '<div class="cv"><div class="frame"></div><div class="label">' + TITLE + '</div>' + clock + '</div>';
  }

  /* 丁を組む：表紙、見返し、本文、奥付 */
  function buildLeaves() {
    var total = pages.length + 1; // 本文 + 奥付
    leaves = [{ front: coverHTML(), back: '<div class="ep"></div>', cover: true }];
    if (G.spread) {
      var M = Math.ceil(total / 2);
      for (var k = 1; k <= M; k++) leaves.push({ front: faceHTML(2 * k - 2, 'L'), back: faceHTML(2 * k - 1, 'R') });
    } else {
      for (var j = 1; j <= total; j++) leaves.push({ front: faceHTML(j - 1, 'L'), back: '<div class="pg R blank"></div>' });
    }
  }

  function buildDOM() {
    stage.innerHTML = '';
    book = document.createElement('div');
    book.className = 'book ' + mode;
    book.style.width = (G.spread ? 2 * G.W : G.W) + 'px';
    book.style.height = G.H + 'px';
    book.innerHTML = '<div class="shadow"></div><div class="board"><div class="ep"></div></div><div class="edge el"></div><div class="edge er"></div>';
    leaves.forEach(function (lf, k) {
      var d = document.createElement('div');
      d.className = 'leaf' + (k === 0 ? ' cover' : '');
      d.innerHTML = '<div class="face front">' + lf.front + '</div><div class="face back' + (k === 0 ? ' endpaper' : '') + '">' + lf.back + '</div>';
      lf.el = d; book.appendChild(d);
    });
    stage.appendChild(book);
  }

  function edgeShadow(t, dir) {
    var out = [];
    for (var i = 1; i <= t; i++) out.push((dir * i) + 'px 0 0 ' + (i % 2 ? '#e4dfd0' : '#c9c2b0'));
    return out.join(',') || 'none';
  }

  function render() {
    var n = leaves.length;
    leaves.forEach(function (lf, k) {
      var fl = k < s;
      lf.el.classList.toggle('flipped', fl);
      lf.el.style.display = (k >= s - 3 && k <= s + 3) ? '' : 'none';
      if (!lf.turn) lf.el.style.zIndex = 10 + (fl ? k + 1 : n - k + 1);
    });
    var el = book.querySelector('.edge.el'), er = book.querySelector('.edge.er'), sh = book.querySelector('.shadow');
    el.style.boxShadow = edgeShadow(Math.max(1, Math.round((1 - s / n) * 5)), -1);
    er.style.boxShadow = edgeShadow(Math.max(0, Math.round((s / n) * 5)), 1);
    var closed = G.spread && s === 0;
    er.style.opacity = s === 0 ? 0 : 1;
    el.style.opacity = s >= n ? 0 : 1;
    book.style.transform = closed ? 'translateX(' + (G.W / 2) + 'px)' : '';
    sh.style.width = (closed || !G.spread ? G.W : 2 * G.W) + 'px';
    sh.style.left = '0px';
    save();
  }

  function pageIndexNow() {
    if (s < 1) return -1;
    var i = G.spread ? 2 * s - 2 : s - 1;
    return Math.min(i, pages.length - 1);
  }
  function save() {
    try {
      var i = pageIndexNow();
      if (i < 0) localStorage.removeItem('shichibun-key');
      else localStorage.setItem('shichibun-key', String(pages[i].key));
    } catch (e) {}
  }
  function restore() {
    try {
      var key = parseInt(localStorage.getItem('shichibun-key'), 10);
      if (isNaN(key)) return 0;
      var idx = 0;
      pages.forEach(function (p, i) { if (p.key <= key) idx = i; });
      var num = idx + 1, st;
      if (G.spread) st = num % 2 === 1 ? (num + 1) / 2 : num / 2 + 1; else st = num;
      return Math.max(1, Math.min(st, leaves.length - 1));
    } catch (e) { return 0; }
  }

  function go(dir) {
    var now = Date.now();
    if (now - lastTurn < 380) return;
    var n = leaves.length;
    if ((dir > 0 && s >= n) || (dir < 0 && s <= 0)) return;
    lastTurn = now;
    var k = dir > 0 ? s : s - 1;
    s += dir;
    var lf = leaves[k];
    lf.turn = true;
    lf.el.style.zIndex = 3000;
    lf.el.classList.remove('turning');
    void lf.el.offsetWidth;
    lf.el.classList.add('turning');
    render();
    setTimeout(function () { lf.turn = false; lf.el.classList.remove('turning'); render(); }, 980);
  }

  /* 全文を読み上げ用に隠して持つ */
  function addSR() {
    var sr = document.createElement('div');
    sr.className = 'sr';
    sr.textContent = BLOCKS.map(function (b) { return b.t === 'ch' ? b.no + ' ' + b.title : (b.x || ''); }).join('\n');
    document.body.appendChild(sr);
  }

  function build(startS) {
    G = geometry();
    mode = G.spread ? 'spread' : 'single';
    applyVars();
    if (!mb) { mb = document.createElement('div'); mb.className = 'text measure'; document.body.appendChild(mb); }
    paginate();
    mb.innerHTML = '';
    buildLeaves();
    buildDOM();
    s = startS === undefined ? restore() : startS;
    s = Math.max(0, Math.min(s, leaves.length));
    render();
  }

  /* 操作：タップ・スワイプ・キー・ホイール */
  var px = null;
  stage.addEventListener('pointerdown', function (e) { px = e.clientX; });
  stage.addEventListener('pointerup', function (e) {
    if (px === null) return;
    var dx = e.clientX - px; px = null;
    if (Math.abs(dx) > 50) go(dx > 0 ? 1 : -1);
    else if (s === 0) go(1);
    else go(e.clientX < innerWidth / 2 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', function () { px = null; });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') { go(1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
    else if (e.key === 'Home') { s = 0; render(); }
  });
  var wl = 0;
  addEventListener('wheel', function (e) {
    var now = Date.now();
    if (now - wl < 450 || Math.abs(e.deltaY) < 8) return;
    wl = now; go(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var i = pageIndexNow(), key = i >= 0 ? pages[i].key : null;
      build(0);
      if (key !== null) {
        var idx = 0; pages.forEach(function (p, j) { if (p.key <= key) idx = j; });
        var num = idx + 1;
        s = G.spread ? (num % 2 === 1 ? (num + 1) / 2 : num / 2 + 1) : num;
        s = Math.max(1, Math.min(s, leaves.length - 1));
        render();
      }
    }, 250);
  });

  /* フォントが届いてから組む（字送りが変わるため） */
  var all = BLOCKS.map(function (b) { return (b.x || '') + (b.title || '') + (b.no || ''); }).join('') + TITLE + '二〇二六年十一月三日初版';
  var wait = Promise.race([
    Promise.all([
      document.fonts.load('400 16px "Shippori Mincho"', all),
      document.fonts.load('500 16px "Shippori Mincho"', all),
      document.fonts.load('700 16px "Shippori Mincho"', all)
    ]),
    new Promise(function (r) { setTimeout(r, 4000); })
  ]).catch(function () {});
  wait.then(function () { build(); addSR(); });
})();
</script>
</body>
</html>
